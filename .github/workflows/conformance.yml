# HelixTest – CI (build and test).
# Push and pull_request run `make prove` (workspace tests; live-service tests are #[ignore]).
# workflow_dispatch can also run `make test-live` when run_live_tests is true.
# That job does not start a server. GitHub-hosted runners have no GA4GH target, so it fails closed.
# See TESTING.md and helixtest/README.md "CI integration".

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Run make test-live against a GA4GH target this runner can already reach. Hosted runners have none."
        type: boolean
        required: false
        default: false


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Same command as a clone + `make prove`: workspace tests + release CLI.
      # Live-service tests are #[ignore] and are not executed here.
      - name: Prove (offline)
        run: make prove

  # Dispatch only. Does not run on push or pull_request.
  # `make test-live` executes the ignored api/auth/e2e/workflow tests.
  # This job does not start Ferrum or any other server.
  test-live:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_live_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config

      - name: Live-service tests
        run: make test-live

  msrv:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev
      - name: MSRV check
        run: cargo check --locked --workspace --all-targets

  build-arm64:
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prove (offline)
        run: make prove
