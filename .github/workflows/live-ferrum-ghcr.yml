# Opt-in: HelixTest against published Ferrum GHCR (edge / SQLite).
#
# Does not run on pull requests. This is demo-mode (auth off, FERRUM_OFFLINE=1),
# labeled honestly — not a hospital auth-on proof. Default image is the tagged
# edge variant so Beacon/DRS run without Postgres.

name: Live Ferrum GHCR

on:
  schedule:
    # Public ambassador proof; demo-mode (auth off). Skip if GHCR pull fails.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      ferrum_image:
        description: "Full GHCR image reference"
        required: true
        default: "ghcr.io/synapticfour/ferrum:v0.3.1-edge"
      only:
        description: "HelixTest --only surface. Empty = --all (edge has no WES)."
        required: false
        default: "beacon"

concurrency:
  group: live-ferrum-ghcr
  cancel-in-progress: true

jobs:
  helixtest-published-ferrum:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Install libsodium and sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config sqlite3

      - name: Build helixtest
        run: cargo build --locked --release --bin helixtest

      - name: Pull published Ferrum
        env:
          FERRUM_IMAGE: ${{ github.event.inputs.ferrum_image || 'ghcr.io/synapticfour/ferrum:v0.3.1-edge' }}
        run: docker pull "$FERRUM_IMAGE"

      - name: Start Ferrum edge (SQLite, auth-off demo)
        env:
          FERRUM_IMAGE: ${{ github.event.inputs.ferrum_image || 'ghcr.io/synapticfour/ferrum:v0.3.1-edge' }}
        run: |
          set -euo pipefail
          DATA="${RUNNER_TEMP}/ferrum-sqlite"
          mkdir -p "$DATA"
          docker run -d --name ferrum-live --user 65532:65532 \
            -p 8080:8080 \
            -v "$DATA:/data" \
            -e FERRUM_OFFLINE=1 \
            -e FERRUM_DEMO=1 \
            -e FERRUM_AUTH__REQUIRE_AUTH=false \
            -e FERRUM_DATABASE__SQLITE_PATH=/data/ferrum.db \
            "$FERRUM_IMAGE"
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:8080/health" >/dev/null; then
              echo "Ferrum is up"
              exit 0
            fi
            sleep 3
          done
          docker logs ferrum-live || true
          echo "Ferrum did not become ready" >&2
          exit 1

      - name: Seed HelixTest Beacon fixture (chr1:1000 A>T)
        run: |
          set -euo pipefail
          DATA="${RUNNER_TEMP}/ferrum-sqlite"
          docker stop ferrum-live
          sqlite3 "$DATA/ferrum.db" <<'SQL'
          INSERT OR IGNORE INTO beacon_datasets (id, name, description, assembly_id)
          VALUES ('default', 'HelixTest Live GHCR seed', 'chr1:1000 A>T', 'GRCh38');
          INSERT INTO beacon_variants (dataset_id, chromosome, start, "end", reference, alternate, variant_type)
          SELECT 'default', 'chr1', 1000, 1000, 'A', 'T', 'SNV'
          WHERE NOT EXISTS (
            SELECT 1 FROM beacon_variants
            WHERE dataset_id = 'default' AND chromosome = 'chr1' AND start = 1000
              AND reference = 'A' AND alternate = 'T'
          );
          SQL
          sudo chown 65532:65532 "$DATA/ferrum.db" "$DATA"/ferrum.db-* 2>/dev/null || sudo chown 65532:65532 "$DATA/ferrum.db"
          docker start ferrum-live
          for i in $(seq 1 40); do
            if curl -sf "http://127.0.0.1:8080/health" >/dev/null; then
              echo "Ferrum is up after Beacon seed"
              break
            fi
            if [ "$i" -eq 40 ]; then
              docker logs ferrum-live || true
              echo "Ferrum did not become ready after seed" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Run HelixTest (demo-mode / auth-off)
        env:
          GATEWAY_BASE: http://127.0.0.1:8080
          BEACON_URL: http://127.0.0.1:8080/ga4gh/beacon/v2
          DRS_URL: http://127.0.0.1:8080/ga4gh/drs/v1
        run: |
          ONLY="${{ inputs.only }}"
          ARGS=(--all --mode ferrum --report json --fail-level 2)
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          ./target/release/helixtest "${ARGS[@]}"
