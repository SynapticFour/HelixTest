# Supply-chain policy for HelixTest. Modelled on Ferrum deny.toml
# (licenses, advisories, bans, sources). HelixTest is Apache-2.0.
# BUSL-1.1 is not allowed: this workspace does not ship BUSL crates.
# crypt4gh is the vendored fork (third_party/crypt4gh), same patch as Ferrum.

[graph]
targets            = []
exclude-unpublished = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
ignore       = []

[licenses]
version              = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots 1.0.9 (via reqwest 0.12) is CDLA-Permissive-2.0.
    "CDLA-Permissive-2.0",
]
[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards         = "warn"
highlight         = "all"
deny              = []
skip              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
