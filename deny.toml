# Supply-chain policy for HelixTest. Modelled on Ferrum deny.toml
# (licenses, advisories, bans, sources). HelixTest is Apache-2.0.
# BUSL-1.1 is not allowed: this workspace does not ship BUSL crates.
# crypt4gh is the crates.io 0.4.1 crate (no [patch.crates-io]).

[graph]
targets            = []
exclude-unpublished = true

[advisories]
yanked       = "warn"
unmaintained = "workspace"
ignore       = [
    # crypt4gh 0.4.1 is the crates.io crate (workspace.dependencies). No [patch.crates-io].
    { id = "RUSTSEC-2022-0011", reason = "rust-crypto 0.2.36 via crates.io crypt4gh 0.4.1. No safe upgrade. Not changed here." },
    { id = "RUSTSEC-2022-0004", reason = "rustc-serialize 0.3.25 via rust-crypto 0.2.36 via crates.io crypt4gh 0.4.1. No safe upgrade. Not changed here." },
    { id = "RUSTSEC-2020-0071", reason = "time 0.1.45 via rust-crypto 0.2.36 via crates.io crypt4gh 0.4.1. Patched in time >=0.2.23, which this dependency line does not use. Not upgraded here." },
    { id = "RUSTSEC-2026-0190", reason = "anyhow 1.0.102 Error::downcast_mut unsoundness. Patched in anyhow >=1.0.103. Not upgraded here." },
    # reqwest 0.11.27 -> hyper 0.14 / rustls 0.21. Both locked h2 versions are below the fix.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 and h2 0.4.14 via hyper and reqwest 0.11.27. Patched in h2 >=0.4.16. Not upgraded here." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101.7 via rustls 0.21.12 and reqwest 0.11.27. URI name constraints. Patched in >=0.103.12; rustls 0.21 cannot take that series. Not upgraded here." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101.7 via rustls 0.21.12 and reqwest 0.11.27. Wildcard name constraints. Patched in >=0.103.12; rustls 0.21 cannot take that series. Not upgraded here." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101.7 via rustls 0.21.12 and reqwest 0.11.27. CRL parse panic. Patched in >=0.103.13; rustls 0.21 cannot take that series. Not upgraded here." },
]

[licenses]
version              = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-roots 0.25.4 (via reqwest 0.11.27) is MPL-2.0 only. File-level copyleft.
    # Kept because this change does not upgrade dependencies.
    "MPL-2.0",
]
[licenses.private]
ignore = true

[[licenses.clarify]]
name          = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.clarify]]
name       = "fuchsia-cprng"
version    = "0.1.1"
expression = "BSD-3-Clause"
license-files = [{ path = "LICENSE", hash = 0xf04ece33 }]

[bans]
multiple-versions = "warn"
wildcards         = "warn"
highlight         = "all"
deny              = []
skip              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
