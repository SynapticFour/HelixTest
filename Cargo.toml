[workspace]
resolver = "2"
members = [
    "helixtest/crates/common",
    "helixtest/crates/framework",
    "helixtest/crates/api-tests",
    "helixtest/crates/workflow-tests",
    "helixtest/crates/e2e-tests",
    "helixtest/crates/auth-tests",
    "helixtest/crates/crypt4gh-tests",
    "helixtest/crates/cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Synaptic Four <contact@synapticfour.com>"]
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "multipart", "stream"] }
jsonschema = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
url = "2"
futures = "0.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
age = { version = "0.10", features = ["async"] }
assert_cmd = "2"
tempfile = "3"
tokio-retry = "0.3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
openapi-deref = "0.1"
once_cell = "1.21"
crypt4gh = "0.4.1"
